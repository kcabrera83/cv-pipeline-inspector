site_name: CV Pipeline Inspector
site_description: Computer vision defect detection on pipeline inspection imagery using image analysis.
repo_url: https://github.com/kcabrera83/cv-pipeline-inspector
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
